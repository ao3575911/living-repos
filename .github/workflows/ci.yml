name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python scripts/gen_readme.py --check
      - run: test -f README.md && test -f PROTOCOL.md && test -f docs/prd.md
      - run: python scripts/validate_examples.py --pin-only
      - name: Validate example manifests
        uses: ao3575911/living-repos-protocol@v0.3.0
        with:
          manifests: "examples/*/.living/manifest.yaml"
      - name: Smoke-run hello demo
        working-directory: examples/hello
        run: |
          python bootstrap.py > /tmp/hello.txt
          diff -u expected-output.txt /tmp/hello.txt
          test "$(cat .living/state.json)" = '{"last_task": "greet", "status": "ready"}'
      - name: Smoke-run snapshot demo
        working-directory: examples/snapshot
        run: |
          python bootstrap.py > /tmp/snapshot.txt
          diff -u expected-output.txt /tmp/snapshot.txt
          test "$(cat work/notes.txt)" = "version 1"
