name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"
      - name: Check links (offline, relative links and anchors)
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          args: --offline --include-fragments --no-progress '**/*.md'
          fail: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-ci.txt
      - run: python scripts/gen_readme.py --check
      - run: test -f README.md && test -f PROTOCOL.md && test -f docs/prd.md
      - run: python scripts/validate_examples.py --pin-only
      - name: Validate example manifests
        uses: ao3575911/living-repos-protocol@v0.4.0
        with:
          manifests: "examples/*/.living/manifest.yaml"
      - name: Smoke-run hello demo in its isolation profile
        run: |
          bash scripts/run_isolated.sh examples/hello > /tmp/hello.txt
          diff -u examples/hello/expected-output.txt /tmp/hello.txt
          test "$(cat examples/hello/.living/state.json)" = '{"last_task": "greet", "status": "ready"}'
      - name: Hello demo refuses an unsupported capability
        run: |
          set +e
          bash scripts/run_isolated.sh examples/hello /repo/tests/unsupported-capability.yaml > /tmp/refused.txt
          code=$?
          set -e
          cat /tmp/refused.txt
          test "$code" = 1
          test "$(cat /tmp/refused.txt)" = '{"event": "refused", "unsupported": ["handoff"]}'
      - name: Smoke-run snapshot demo in its isolation profile
        run: |
          bash scripts/run_isolated.sh examples/snapshot > /tmp/snapshot.txt
          diff -u examples/snapshot/expected-output.txt /tmp/snapshot.txt
          test "$(cat examples/snapshot/work/notes.txt)" = "version 1"
